<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nedalto</title>
  <meta name="description" content="A local-first smart home hub built exclusively on the Matter protocol.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #13233f;
      --muted: #4a5872;
      --line: #e3e7ee;
      --accent: #149e95;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1424;
        --ink: #e8edf5;
        --muted: #9aa7bc;
        --line: #24324a;
        --accent: #1fb8ad;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 34rem; text-align: center; }
    .logo { display: block; width: min(20rem, 80vw); height: auto; margin: 0 auto; }
    .ink-s { stroke: var(--ink); }
    .ink-f { fill: var(--ink); }
    .node { fill: var(--bg); stroke: var(--ink); }
    .accent { fill: var(--accent); }
    p {
      margin-top: 1.75rem;
      font-size: clamp(1rem, 3.2vw, 1.15rem);
      line-height: 1.5;
      text-wrap: balance;
      color: var(--muted);
    }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.6rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font-size: 0.95rem;
      text-decoration: none;
      transition: border-color 0.15s;
    }
    a:hover, a:focus-visible { border-color: var(--accent); }
  </style>
</head>
